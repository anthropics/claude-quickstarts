[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentpolicy"
version = "0.1.0"
description = "Least-privilege policy for Claude Managed Agents sessions in NVIDIA OpenShell sandboxes"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["NOTICE", "third_party/openshell/LICENSE", "sandbox/openshell-skills/LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12",
    "grpcio>=1.60",
    "protobuf>=4.25",
    "pyyaml>=6.0",
    "cryptography>=42",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60",
    "pytest>=8",
]

[project.scripts]
agentpolicy = "agentpolicy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpolicy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
