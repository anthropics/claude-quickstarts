# The environment definition, which `ant apply` sends to the Environments API.
# A self-hosted environment has no sandbox template: it is a work queue that
# your own poller (start.sh) claims sessions from. `ant apply` records its ID
# in claude-lock.json, where start.sh reads it. Mint the environment key for
# it in the Console and put it in .env as ANTHROPIC_ENVIRONMENT_KEY.
name: quickstart-self-hosted-sandbox-openshell-env
metadata:
  # Names the example within the quickstart. Safe to remove.
  anthropic_quickstart: self-hosted-sandboxes/openshell
config:
  type: self_hosted
