# The base policy: what every worker sandbox needs, whatever its agent.
#
# This is a template. agentpolicy replaces the {{...}} placeholders with the
# session's own values before OpenShell or the prover ever reads it, so the
# file is not valid YAML until it is rendered.
#
#   {{SESSION_ID}}      the Managed Agents session the sandbox serves (sesn_...)
#   {{ENVIRONMENT_ID}}  the Managed Agents environment whose queue the session came from
#   {{API_HOST}}        the Managed Agents API's address as the sandbox sees it
#   {{API_PORT}}        its port
#
# A profile's grants (profiles/<name>/policy.yaml) are added on top of this
# file. A profile cannot change anything here: a grant whose rule name
# collides with one below is refused when the policy is composed.
#
# Schema: https://docs.nvidia.com/openshell/latest/how-it-works/policies/schema
version: 1

# An allowlist for reads as well as writes. Paths not listed cannot be opened.
# Fixed for the sandbox's lifetime: a change needs a new sandbox.
#
# Ceilings and grants add network rules only: both sides of every proof take
# these paths from this file.
filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    # OpenShell adds /var/log to any policy with a network rule. Listing it
    # keeps the rendered policy identical to what a sandbox reports.
    - /var/log
  read_write:
    - /workspace
    - /tmp
    - /dev/null
    # The worker runs bash on a pseudo-terminal. Without these two, every
    # bash call fails with "open /dev/ptmx: permission denied".
    - /dev/ptmx
    - /dev/pts

# Refuse to start a sandbox whose filesystem rules the kernel cannot enforce.
landlock:
  compatibility: hard_requirement

network_policies:
  # Every call `ant beta:worker run` makes for a session with no skills and no
  # memory store, pinned to this session. OpenShell matches method and path,
  # not credentials: with a wildcard where the session ID goes, code in the
  # sandbox could act on any other session it held a token for.
  claude_managed_agents:
    name: claude_managed_agents
    endpoints:
      - host: "{{API_HOST}}"
        port: {{API_PORT}}
        protocol: rest
        # The default is audit, which logs a violation and lets it through.
        enforcement: enforce
        rules:
          # Session lookup, once at startup.
          - allow: { method: GET, path: "/v1/sessions/{{SESSION_ID}}" }
          # Event history, read after every (re)connect of the stream.
          - allow: { method: GET, path: "/v1/sessions/{{SESSION_ID}}/events" }
          # The event stream that delivers tool calls.
          - allow: { method: GET, path: "/v1/sessions/{{SESSION_ID}}/events/stream" }
          # Tool results.
          - allow: { method: POST, path: "/v1/sessions/{{SESSION_ID}}/events" }
          # The lease on the work item, renewed while the worker runs.
          - allow: { method: POST, path: "/v1/environments/{{ENVIRONMENT_ID}}/work/*/heartbeat" }
          # Release of the work item when the worker exits.
          - allow: { method: POST, path: "/v1/environments/{{ENVIRONMENT_ID}}/work/*/stop" }
    # Matches the program that opens the connection or any of its parent
    # processes. The agent's shell is a child of ant, so it can reach these six
    # routes too. The route list is what limits whoever uses them: four are
    # pinned to this session, and the two work routes to this environment.
    binaries:
      - path: /usr/local/bin/ant
