}

// Fetch provider type profile request.
message GetProviderProfileRequest {
  // Workspace scope. Omit for platform profiles; otherwise select one named workspace.
  openshell.datamodel.v1.WorkspaceSelector workspace_scope = 2;
  string id = 1;
}

// Provider profile payload with optional source metadata for diagnostics.
message ProviderProfileImportItem {
  ProviderProfile profile = 1;
  string source = 2;
}

// Provider profile validation diagnostic.
message ProviderProfileDiagnostic {
  string source = 1;
  string profile_id = 2;
  string field = 3;
  string message = 4;
  string severity = 5;
}

// Endpoint selector for token grant audience overrides.
message ProviderCredentialTokenGrantAudienceOverride {
  // Optional: endpoint host selector. If omitted, inherits the profile endpoint host.
  string host = 1;

  // Optional: endpoint port selector. If omitted, matches the expanded profile endpoint port.
  uint32 port = 2;

  // Optional: endpoint path selector. If omitted, inherits the profile endpoint path.
  string path = 3;

  // Resource audience to request for matching endpoints.
  string audience = 4;

  // Optional: OAuth2 scopes to request. If omitted, inherits the token grant scopes.
  repeated string scopes = 5;
}

// Provider credential token grant configuration.
// When present, the credential is obtained dynamically via OAuth2 grant when needed.
enum ProviderCredentialTokenGrantType {
  PROVIDER_CREDENTIAL_TOKEN_GRANT_TYPE_UNSPECIFIED = 0;
  PROVIDER_CREDENTIAL_TOKEN_GRANT_TYPE_CLIENT_CREDENTIALS = 1;
  PROVIDER_CREDENTIAL_TOKEN_GRANT_TYPE_TOKEN_EXCHANGE = 2;
}

message ProviderCredentialTokenGrantSubjectToken {
  // Source for the token exchange subject token. Phase one supports
  // "provider_credential".
  string source = 1;

  // Provider credential key that stores the subject token.
  string credential = 2;

  // OAuth2 subject_token_type. If omitted, OpenShell uses
  // urn:ietf:params:oauth:token-type:access_token.
  string subject_token_type = 3;
}

message ProviderCredentialTokenGrant {
  reserved 4;
  reserved "cache_ttl_seconds";
  // OAuth2 token endpoint URL (e.g., https://keycloak.example.com/realms/my-realm/protocol/openid-connect/token)
  string token_endpoint = 1;

  // Optional: default resource audience to request from the token service
  string audience = 2;

  // Optional: audience to request when fetching the JWT-SVID from SPIRE.
  // If omitted, the sandbox derives this from token_endpoint.
  string jwt_svid_audience = 6;

  // Optional: OAuth2 scopes to request
  repeated string scopes = 3;

  // Optional token cache TTL override. If absent, use expires_in from the token response.
  google.protobuf.Duration cache_ttl = 104;

  // Optional: endpoint-specific resource audience overrides.
  repeated ProviderCredentialTokenGrantAudienceOverride audience_overrides = 5;

  // Optional: OAuth2 client_assertion_type value. If omitted, OpenShell uses
  // urn:ietf:params:oauth:client-assertion-type:jwt-bearer.
  string client_assertion_type = 7;

  // Grant type. If omitted/unspecified, OpenShell treats this as client_credentials
  // for backwards compatibility.
  ProviderCredentialTokenGrantType grant_type = 8;

  // Subject token metadata for token_exchange grants.
  ProviderCredentialTokenGrantSubjectToken subject_token = 9;

  // OAuth2 requested_token_type. If omitted for token_exchange, OpenShell uses
  // urn:ietf:params:oauth:token-type:access_token.
  string requested_token_type = 10;
}

// Provider credential declaration.
message ProviderProfileCredential {
  string name = 1;
  string description = 2;
  repeated string env_vars = 3;
  bool required = 4;
  string auth_style = 5;
  string header_name = 6;
  string query_param = 7;
  ProviderCredentialRefresh refresh = 8;
  string path_template = 9;
  ProviderCredentialTokenGrant token_grant = 10;
}

enum ProviderCredentialRefreshStrategy {
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_UNSPECIFIED = 0;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_STATIC = 1;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_EXTERNAL = 2;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_OAUTH2_REFRESH_TOKEN = 3;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_OAUTH2_CLIENT_CREDENTIALS = 4;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_GOOGLE_SERVICE_ACCOUNT_JWT = 5;
  PROVIDER_CREDENTIAL_REFRESH_STRATEGY_AWS_STS_ASSUME_ROLE = 6;
}

message ProviderCredentialRefreshMaterial {
  string name = 1;
  string description = 2;
  bool required = 3;
  bool secret = 4;
}

// Declares that a single refresh operation mints more than one credential.
// The refresh is attached to a primary credential; each additional output
// maps a strategy-defined semantic output id to a sibling credential whose
// env_vars receive the minted value.
message ProviderCredentialRefreshOutput {
  string output = 1;      // strategy-defined semantic output id (e.g. "session_token")
  string credential = 2;  // sibling credential name whose env_vars receive this output
}

message ProviderCredentialRefresh {
  reserved 4, 5;
  reserved "refresh_before_seconds", "max_lifetime_seconds";
  ProviderCredentialRefreshStrategy strategy = 1;
  string token_url = 2;
  repeated string scopes = 3;
  google.protobuf.Duration refresh_before = 104;
  google.protobuf.Duration max_lifetime = 105;
  repeated ProviderCredentialRefreshMaterial material = 6;
  repeated ProviderCredentialRefreshOutput additional_outputs = 7;
}

message ProviderCredentialRefreshStatus {
  reserved 6, 7, 8, 13;
  reserved "expires_at_ms", "next_refresh_at_ms", "last_refresh_at_ms", "last_error_at_ms";
  string provider = 1;
  string provider_id = 2;
  string credential_key = 3;
  ProviderCredentialRefreshStrategy strategy = 4;
  string status = 5;
  google.protobuf.Timestamp expiration_time = 106;
  // Next automatic refresh time. Absence means no automatic retry is scheduled;
  // use recovery_action to determine the required recovery workflow.
  google.protobuf.Timestamp next_refresh_time = 107;
  google.protobuf.Timestamp last_refresh_time = 108;
  string last_error = 9;
  ProviderCredentialRefreshRecoveryAction recovery_action = 10;
  // Stable gateway-owned failure identifier, for example
  // "oauth_invalid_grant". This is not provider-controlled prose and
  // incorporates any recognized top-level OAuth error classification.
  string failure_code = 11;
  // A bounded, recognized provider subtype that refines failure_code; clients
  // do not need a separate provider_error field. Unknown provider-controlled
  // values are not persisted or returned.
  string provider_error_subtype = 12;
  google.protobuf.Timestamp last_error_time = 113;
}

// Provider profile local discovery declaration.
message ProviderProfileDiscovery {
  // Credential names from ProviderProfile.credentials eligible for local discovery.
  repeated string credentials = 1;
}

message GetProviderRefreshStatusRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  openshell.datamodel.v1.WorkspaceSelector workspace_scope = 3;
  string provider = 1;
  string credential_key = 2;
}

message GetProviderRefreshStatusResponse {
  repeated ProviderCredentialRefreshStatus credentials = 1;
}

message ConfigureProviderRefreshRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  openshell.datamodel.v1.WorkspaceSelector workspace_scope = 7;
  reserved 6;
  reserved "expires_at_ms";
  string provider = 1;
  string credential_key = 2;
  ProviderCredentialRefreshStrategy strategy = 3;
  map<string, string> material = 4 [(openshell.options.v1.secret) = true];
  // Additional material names the caller requests be stored as secrets. Every
  // name must be present in material. The server also classifies secrets from
  // the authoritative provider profile and refresh strategy.
  repeated string secret_material_keys = 5;
  google.protobuf.Timestamp expiration_time = 106;
  // Optional nonzero UUID for durable at-most-once admission. Successful results
  // can be replayed for 24 hours; see the API errors and retries reference.
  string request_id = 8;
}

message ConfigureProviderRefreshResponse {
  ProviderCredentialRefreshStatus status = 1;
}

message RotateProviderCredentialRequest {
  // Workspace scope. Only a named workspace selection is accepted.
  openshell.datamodel.v1.WorkspaceSelector workspace_scope = 3;
  string provider = 1;
  string credential_key = 2;
  // Optional nonzero UUID for durable at-most-once admission. Successful results
  // can be replayed for 24 hours; see the API errors and retries reference.
  string request_id = 4;
}

message RotateProviderCredentialResponse {
