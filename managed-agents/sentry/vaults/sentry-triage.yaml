# The vault: a named container for credentials that Anthropic holds for you
# and injects at session runtime. `ant apply` creates the container from this
# file (it takes `display_name` and `metadata`, nothing else) and records its
# ID in claude-lock.json. What goes in it is not declared here: no secret
# passes through `ant apply`, so ./agents/setup.sh adds the Sentry token as an
# environment_variable credential with `ant beta:vaults:credentials create`.
display_name: quickstart-sentry-triage
metadata:
  quickstart: sentry
