  reserved "deleted";
  DeletionOutcome outcome = 2;
}

// Stable provider profile categories used by clients for grouping and filtering.
enum ProviderProfileCategory {
  PROVIDER_PROFILE_CATEGORY_UNSPECIFIED = 0;
  PROVIDER_PROFILE_CATEGORY_OTHER = 1;
  PROVIDER_PROFILE_CATEGORY_INFERENCE = 2;
  PROVIDER_PROFILE_CATEGORY_AGENT = 3;
  PROVIDER_PROFILE_CATEGORY_SOURCE_CONTROL = 4;
  PROVIDER_PROFILE_CATEGORY_MESSAGING = 5;
  PROVIDER_PROFILE_CATEGORY_DATA = 6;
  PROVIDER_PROFILE_CATEGORY_KNOWLEDGE = 7;
}

// Provider type profile metadata exposed to clients.
message ProviderProfile {
  string id = 1;
  string display_name = 2;
  string description = 3;
  ProviderProfileCategory category = 4;
  repeated ProviderProfileCredential credentials = 5;
  repeated openshell.sandbox.v1.NetworkEndpoint endpoints = 6;
  repeated openshell.sandbox.v1.NetworkBinary binaries = 7;
  bool inference_capable = 8;
  ProviderProfileDiscovery discovery = 9;
  // Storage resource version for custom profiles. Built-in profiles and new
  // profile files use 0. Gateway responses set this for stored custom profiles.
  // Update calls use this for optimistic concurrency.
  uint64 resource_version = 10;
  // Optional non-secret annotations attached by profile sources or importers.
  map<string, string> annotations = 11;
  // Server-set provenance: "builtin", "user", or "interceptor/{name}".
  // Ignored on import/update payloads.
  string source = 12;
  // Server-set visibility: "platform", "workspace", or empty for
  // non-scoped sources. Ignored on import/update payloads.
  string scope = 13;
}

// Provider profile response.
message ProviderProfileResponse {
